info:
  name: Peticion2-Login(obtener token)
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "usuario": "Ana Cliente",
        "clave": "secreta"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
