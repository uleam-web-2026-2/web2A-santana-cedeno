info:
  name: Peticion3-Listar mascotas(con token)
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/mascotas
  headers:
    - name: Authorization
      value: bearer  {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
