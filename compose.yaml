services:
  db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: nutricion_mascotas
      API_DB_PASSWORD: "${API_DB_PASSWORD}"
    volumes:
      - nutricion_datos:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutricion_mascotas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=db user=nutricion_api password=${API_DB_PASSWORD} dbname=nutricion_mascotas port=5432 sslmode=disable"
      TOKEN_SECRETO: "${TOKEN_SECRETO}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nutricion_datos: