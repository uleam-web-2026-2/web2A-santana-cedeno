services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutricion_mascotas
    volumes:
      - nutricion_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutricion_mascotas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=db user=postgres password=postgres dbname=nutricion_mascotas port=5432 sslmode=disable"
      TOKEN_SECRETO: "secreto-local-taller11"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nutricion_datos: